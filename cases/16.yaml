schema_version: 1

id: "16"
name: Axially compressed cylindrical shell buckling
tags: {analysis: B, geometry: Sh, material: LE}
difficulty: hard

prompt_segments:
  - text: >-
      A thin-walled circular cylindrical shell has radius R = 100 mm, length L = 200 mm and wall
      thickness t = {t} mm, simply supported at both ends, under uniform axial compression.
    requires: t
  - text: " The material has Young's modulus E = {E} GPa and Poisson's ratio nu = {nu}."
    requires: E
  - text: >-
      Apply a reference axial edge stress of {sref} MPa and perform a linear (eigenvalue)
      buckling analysis. Report the classical linear critical axial stress, and comment on how
      it compares with experimentally observed buckling loads. Requirements: use the mm-N-MPa
      unit system.

parameters:
  t:    {value: 1,   unit: mm,  droppable: true,  on_drop: ask,       critical: true}
  E:    {value: 200, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  nu:   {value: 0.3, unit: "-", droppable: false}
  sref: {value: 1,   unit: MPa, droppable: false}

drop_policy:
  eligible: [t, E]
  n_drop: {min: 0, max: 2}

inputs: {R_mm: 100, L_mm: 200, t_mm: 1, E_GPa: 200, nu: 0.3, sref_MPa: 1}

modeling_contract:
  required_sets: []
  notes: mm-N-MPa; shell elements (S4R); Buckle step; SS ends; reference axial stress 1 MPa.

expected:
  - name: classical_critical_stress
    description: Classical linear buckling critical axial stress
    kind: exact
    value: 1210
    tol: 0.10
    unit: MPa
    extract: {source: odb, quantity: buckling_load, mode: 1, ref_load_MPa: 1}
  - name: imperfection_awareness
    description: Did the answer note that real shells buckle far below the classical value (knock-down factor)?
    kind: trend
    value_status: ok
    extract: {source: agent_report, report_key: imperfection_comment}

reference:
  formula: "sigma_cr = E t / [R sqrt(3(1-nu^2))]"
  computed: {classical_critical_stress: 1210}
  source: "Classical cylindrical-shell buckling (Timoshenko); imperfection sensitivity well known"

notes: |
  Linear eigenvalue analysis reproduces ~classical value; real cylinders buckle at 20-60% of it.
  imperfection_awareness rewards the qualitative engineering caveat (couples to D1).
