schema_version: 1

id: "08"
name: Plate with a central hole, elastoplastic tension
tags: {analysis: S, geometry: Pl, material: EP}
difficulty: medium

prompt_segments:
  - text: >-
      A rectangular plate 200 mm long and 100 mm wide with thickness 5 mm has a central circular
      hole of diameter 20 mm. Use a plane-stress model (exploit symmetry as appropriate).
  - text: " The two short ends are pulled by a uniform tension, ramped up to a remote nominal stress of {load} MPa."
    requires: load
  - text: " The material is steel, modelled as elastic-perfectly-plastic with no hardening."
  - text: " The Young's modulus is E = {E} GPa."
    requires: E
  - text: " The yield stress is sigma_y = {sy} MPa."
    requires: sy
  - text: >-
      Report the limit load at which the net section across the hole becomes fully plastic.
      Requirements: use the mm-N-MPa unit system; put the loaded end nodes in a node set named
      LOAD_EDGE.

parameters:
  load: {value: 200, unit: MPa, droppable: true,  on_drop: ask,       critical: false}
  E:    {value: 200, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  sy:   {value: 250, unit: MPa, droppable: true,  on_drop: ask,       critical: true}

drop_policy:
  eligible: [load, E, sy]
  n_drop: {min: 0, max: 2}

inputs: {W_mm: 100, L_mm: 200, d_mm: 20, t_mm: 5, E_GPa: 200, sigma_y_MPa: 250, Kt: 3}

modeling_contract:
  required_sets: [LOAD_EDGE]
  notes: mm-N-MPa; plane-stress elements (CPS4/CPS8); elastic-perfectly-plastic; ramp load to collapse.

expected:
  - name: limit_load
    description: Net-section fully-plastic (limit) load
    kind: exact
    value: 100000
    tol: 0.05
    unit: N
    extract: {source: odb, field: RF, quantity: reaction_force, location: {set: LOAD_EDGE, op: max_abs}}
  - name: first_yield_remote_stress
    description: Remote nominal stress at first yield at the hole edge (Kt ~ 3)
    kind: trend
    range: [70, 100]
    sign: "+"
    unit: MPa
    value_status: needs_literature_pinning
    extract: {source: agent_report, report_key: first_yield_remote_stress}

reference:
  formula: "Limit load = sigma_y * t * (W - d) = 250 * 5 * (100-20); first yield ~ sigma_y / Kt"
  computed: {limit_load: 100000, first_yield_remote_stress: 83}
  source: "Stress concentration (Peterson) + limit analysis"

notes: Limit load is mesh-robust; first-yield stress is Kt/mesh sensitive, graded as trend.
