schema_version: 1

id: "09"
name: Thick-walled cylinder, elastoplastic internal pressure
tags: {analysis: S, geometry: Ax, material: EP}
difficulty: medium

prompt_segments:
  - text: >-
      A long thick-walled cylinder has inner radius a = 10 mm and outer radius b = 20 mm
      (axisymmetric, plane-strain / closed-end). The internal pressure is increased gradually.
  - text: " The material is steel, elastic-perfectly-plastic (von Mises)."
  - text: " The Young's modulus is E = {E} GPa."
    requires: E
  - text: " The yield stress is sigma_y = {sy} MPa."
    requires: sy
  - text: >-
      Report (1) the internal pressure at which the inner wall first yields and (2) the limit
      pressure at which the wall becomes fully plastic. Requirements: use the mm-N-MPa unit
      system; put the inner-wall nodes in a node set named INNER_WALL.

parameters:
  E:  {value: 200, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  sy: {value: 250, unit: MPa, droppable: true,  on_drop: ask,       critical: true}

drop_policy:
  eligible: [E, sy]
  n_drop: {min: 0, max: 2}

inputs: {a_mm: 10, b_mm: 20, E_GPa: 200, sigma_y_MPa: 250}

modeling_contract:
  required_sets: [INNER_WALL]
  notes: mm-N-MPa; axisymmetric elements (CAX4/CAX8); elastic-perfectly-plastic; ramp pressure.

expected:
  - name: yield_pressure
    description: Internal pressure at first yield of the inner wall
    kind: exact
    value: 108.3
    tol: 0.05
    unit: MPa
    extract: {source: odb, field: PEEQ, quantity: yield_onset, location: {set: INNER_WALL, op: max}}
  - name: limit_pressure
    description: Fully-plastic limit pressure
    kind: exact
    value: 200.1
    tol: 0.05
    unit: MPa
    extract: {source: agent_report, report_key: limit_pressure}

reference:
  formula: "p_y = (sigma_y/sqrt3)(1 - a^2/b^2); p_limit = (2 sigma_y/sqrt3) ln(b/a)"
  computed: {yield_pressure: 108.3, limit_pressure: 200.1}
  source: "Hill, The Mathematical Theory of Plasticity (thick cylinder)"

notes: |
  yield_pressure detected via PEEQ onset at inner wall; limit_pressure is the max sustained
  internal pressure before plastic collapse. Use von Mises (sqrt3 factors), not Tresca.
