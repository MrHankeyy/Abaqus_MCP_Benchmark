schema_version: 1

id: "14"
name: Euler column buckling
tags: {analysis: B, geometry: 3D, material: LE}
difficulty: easy

prompt_segments:
  - text: >-
      A steel column of length L = 1.0 m has a 20 mm x 20 mm square cross-section and is pinned
      at both ends (free to rotate, restrained transversely). It is loaded by an axial
      compressive force.
  - text: " The material has Young's modulus E = {E} GPa."
    requires: E
  - text: >-
      Apply a reference axial compressive load of {Pref} kN and perform a linear (eigenvalue)
      buckling analysis. Report the first buckling load factor and the corresponding critical
      load. Requirements: use the mm-N-MPa unit system.

parameters:
  E:    {value: 200, unit: GPa, droppable: true, on_drop: assume_ok, critical: false}
  Pref: {value: 1,   unit: kN,  droppable: false}

drop_policy:
  eligible: [E]
  n_drop: {min: 0, max: 1}

inputs: {L_m: 1.0, section_mm: [20, 20], I_m4: 1.3333e-8, E_GPa: 200, K: 1.0, Pref_kN: 1}

modeling_contract:
  required_sets: []
  notes: mm-N-MPa; beam (B31) or solid; Buckle (eigenvalue) step; pinned-pinned (K=1); reference load 1 kN.

expected:
  - name: critical_load
    description: First critical buckling load (eigenvalue x reference load)
    kind: exact
    value: 26.3
    tol: 0.03
    unit: kN
    extract: {source: odb, quantity: buckling_load, mode: 1, ref_load_N: 1000}

reference:
  formula: "P_cr = pi^2 E I / (K L)^2; I = b h^3/12; K = 1 (pinned-pinned)"
  computed: {critical_load: 26.3}
  source: "Euler column buckling (Timoshenko, Theory of Elastic Stability)"

notes: critical_load = first eigenvalue x Pref. With Pref = 1 kN, eigenvalue ~ 26.3.
