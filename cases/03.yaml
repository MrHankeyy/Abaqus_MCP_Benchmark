schema_version: 1

id: "03"
name: Thick-walled cylinder under internal pressure (Lame)
tags: {analysis: S, geometry: Ax, material: LE}
difficulty: easy

prompt_segments:
  - text: >-
      A long thick-walled cylinder has inner radius a = 10 mm and outer radius b = 20 mm; the
      outer surface is traction-free and the ends are treated as plane strain.
  - text: " It is subjected to an internal pressure p = {p} MPa."
    requires: p
  - text: " The material is steel: Young's modulus E = {E} GPa, Poisson's ratio nu = {nu}."
    requires: E
  - text: >-
      Build an axisymmetric model and report the hoop (circumferential) stress at the inner wall
      and the radial displacement of the inner wall. Requirements: use the mm-N-MPa unit system;
      create a node set named INNER_WALL containing the nodes on the inner wall.

parameters:
  p:  {value: 100, unit: MPa, droppable: true,  on_drop: ask,       critical: true}
  E:  {value: 200, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  nu: {value: 0.3, unit: "-", droppable: false}

drop_policy:
  eligible: [p, E]
  n_drop: {min: 0, max: 2}

inputs: {a_mm: 10, b_mm: 20, p_MPa: 100, E_GPa: 200, nu: 0.3, end_condition: plane_strain}

modeling_contract:
  required_sets: [INNER_WALL]
  notes: mm-N-MPa unit system; axisymmetric elements (CAX4/CAX8); internal pressure on inner wall.

expected:
  - name: hoop_stress_inner
    description: Hoop (circumferential) stress at the inner wall, sigma_theta(a)
    kind: exact
    value: 166.7
    tol: 0.02
    unit: MPa
    extract: {source: odb, field: S, component: S33, location: {set: INNER_WALL, op: max_abs}}
  - name: radial_disp_inner
    description: Radial displacement of the inner wall, u_r(a)
    kind: exact
    value: 9.83e-3
    tol: 0.03
    unit: mm
    extract: {source: odb, field: U, component: U1, location: {set: INNER_WALL, op: mean}}

reference:
  formula: "sigma_theta(a)=p(b^2+a^2)/(b^2-a^2);  u_r(a)=(p*a/E)*[(b^2+a^2)/(b^2-a^2)+nu]"
  computed: {hoop_stress_inner: 166.7, radial_disp_inner: 9.83e-3}
  source: "Lame solution, theory of elasticity (Timoshenko, Theory of Elasticity)"

notes: "In CAX elements: S11=radial, S22=axial, S33=hoop. Outer hoop sigma_theta(b)=66.7 MPa is a cross-check."
