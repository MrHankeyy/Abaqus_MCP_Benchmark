schema_version: 1

id: "06"
name: Rubber block uniaxial tension (Neo-Hookean)
tags: {analysis: S, geometry: 3D, material: HE}
difficulty: medium

prompt_segments:
  - text: "A cube of rubber with side length 50 mm is fixed on one face and pulled on the opposite face along x."
  - text: " It is stretched to an engineering strain of {strain}% (stretch ratio lambda = {lam})."
    requires: strain
  - text: >-
      The material is nearly incompressible and modelled with a Neo-Hookean strain energy:
      C10 = {C10} MPa (with a small compressibility, D1 chosen for near-incompressibility).
    requires: C10
  - text: >-
      Report the Cauchy (true) stress in the loading direction at the steady deformed state.
      Requirements: use the mm-N-MPa unit system; enable geometric nonlinearity (NLGEOM); put
      all elements in an element set named BODY.

parameters:
  strain: {value: 100, unit: "%",  droppable: true,  on_drop: ask, critical: true}
  lam:    {value: 2,   unit: "-",  droppable: false}   # tied to strain; shown only with the strain clause
  C10:    {value: 0.2, unit: MPa,  droppable: true,  on_drop: ask, critical: true}

drop_policy:
  eligible: [strain, C10]
  n_drop: {min: 0, max: 2}

inputs: {side_mm: 50, lambda: 2, C10_MPa: 0.2, model: neo_hookean}

modeling_contract:
  required_sets: [BODY]
  notes: mm-N-MPa; hybrid solid elements (C3D8H); NLGEOM=ON; near-incompressible.

expected:
  - name: cauchy_stress_x
    description: Cauchy stress along loading direction at lambda = 2
    kind: exact
    value: 1.40
    tol: 0.03
    unit: MPa
    extract: {source: odb, field: S, component: S11, location: {set: BODY, op: mean}}
  - name: nominal_stress_x
    description: Nominal (engineering) stress along loading direction at lambda = 2
    kind: exact
    value: 0.70
    tol: 0.03
    unit: MPa
    extract: {source: agent_report, report_key: nominal_stress_x}

reference:
  formula: "Incompressible Neo-Hookean uniaxial: P = 2 C10 (lambda - lambda^-2); sigma = 2 C10 (lambda^2 - lambda^-1)"
  computed: {cauchy_stress_x: 1.40, nominal_stress_x: 0.70}
  source: "Hyperelastic closed form (Holzapfel, Nonlinear Solid Mechanics)"

notes: Homogeneous deformation -> FE should match closed form closely with hybrid elements.
