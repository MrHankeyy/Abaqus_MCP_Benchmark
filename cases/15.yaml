schema_version: 1

id: "15"
name: Axially compressed plate buckling
tags: {analysis: B, geometry: Sh, material: LE}
difficulty: medium

prompt_segments:
  - text: >-
      A rectangular steel plate 300 mm long and 100 mm wide, simply supported on all four edges,
      is loaded by a uniform in-plane axial compression along its long (300 mm) direction.
  - text: " The plate thickness is t = {t} mm."
    requires: t
  - text: " The material has Young's modulus E = {E} GPa and Poisson's ratio nu = {nu}."
    requires: E
  - text: >-
      Apply a reference compressive edge stress of {sref} MPa and perform a linear (eigenvalue)
      buckling analysis. Report the critical buckling stress. Requirements: use the mm-N-MPa
      unit system.

parameters:
  t:    {value: 2,   unit: mm,  droppable: true,  on_drop: ask,       critical: true}
  E:    {value: 200, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  nu:   {value: 0.3, unit: "-", droppable: false}
  sref: {value: 1,   unit: MPa, droppable: false}

drop_policy:
  eligible: [t, E]
  n_drop: {min: 0, max: 2}

inputs: {a_mm: 300, b_mm: 100, t_mm: 2, E_GPa: 200, nu: 0.3, k: 4, sref_MPa: 1}

modeling_contract:
  required_sets: []
  notes: mm-N-MPa; shell elements (S4R); Buckle step; simply supported; reference edge stress 1 MPa.

expected:
  - name: critical_stress
    description: Critical buckling stress
    kind: exact
    value: 289
    tol: 0.05
    unit: MPa
    extract: {source: odb, quantity: buckling_load, mode: 1, ref_load_MPa: 1}

reference:
  formula: "sigma_cr = k pi^2 E / [12(1-nu^2)] (t/b)^2; k = 4 for a long SS plate in uniaxial compression"
  computed: {critical_stress: 289}
  source: "Plate buckling (Timoshenko, Theory of Elastic Stability)"

notes: k = 4 holds for long simply-supported plates; aspect ratio 3 is long enough.
