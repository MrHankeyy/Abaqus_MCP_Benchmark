schema_version: 1

id: "12"
name: Simply supported square plate, modal
tags: {analysis: M, geometry: Sh, material: LE}
difficulty: easy

prompt_segments:
  - text: "A square plate of side length a = 1.0 m is simply supported on all four edges."
  - text: " The plate thickness is t = {t} mm."
    requires: t
  - text: " The material is steel with Poisson's ratio nu = {nu}."
  - text: " The Young's modulus is E = {E} GPa."
    requires: E
  - text: " The density is rho = {rho} kg/m^3."
    requires: rho
  - text: >-
      Perform a modal (frequency) analysis and report the first natural frequency and the next
      distinct natural frequency. Requirements: use the m-kg-s unit system (frequencies in Hz);
      extract at least the first 6 modes.

parameters:
  t:   {value: 10,   unit: mm,       droppable: true,  on_drop: ask,       critical: true}
  E:   {value: 200,  unit: GPa,      droppable: true,  on_drop: assume_ok, critical: false}
  nu:  {value: 0.3,  unit: "-",      droppable: false}
  rho: {value: 7850, unit: kg/m^3,   droppable: true,  on_drop: assume_ok, critical: true}

drop_policy:
  eligible: [t, E, rho]
  n_drop: {min: 0, max: 2}

inputs: {a_m: 1.0, t_mm: 10, E_GPa: 200, nu: 0.3, rho: 7850}

modeling_contract:
  required_sets: []
  notes: m-kg-s; thin-shell elements (S4R/S8R); simple supports; frequency (Lanczos) step.

expected:
  - name: freq_mode_11
    description: Fundamental frequency (mode 1,1)
    kind: exact
    value: 47.97
    tol: 0.03
    unit: Hz
    extract: {source: odb, quantity: eigenfrequency, mode: 1}
  - name: freq_mode_12
    description: Next distinct frequency (modes 1,2 and 2,1 are degenerate)
    kind: exact
    value: 119.9
    tol: 0.03
    unit: Hz
    extract: {source: odb, quantity: eigenfrequency, mode: 2}

reference:
  formula: "f_mn = (pi/2)(m^2+n^2)/a^2 * sqrt(D/(rho t)); D = E t^3/[12(1-nu^2)]"
  computed: {freq_mode_11: 47.97, freq_mode_12: 119.9}
  source: "Thin-plate free vibration (Blevins / Leissa)"

notes: Modes (1,2) and (2,1) are degenerate; odb modes 2 and 3 should be ~equal.
