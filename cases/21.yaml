schema_version: 1

id: "21"
name: Heated thick-walled cylinder, thermal stress
tags: {analysis: T, geometry: Ax, material: LE}
difficulty: hard

prompt_segments:
  - text: >-
      A long thick-walled cylinder has inner radius a = 10 mm and outer radius b = 20 mm
      (axisymmetric, plane strain), with no mechanical load. A steady-state radial temperature
      field is established (logarithmic profile).
  - text: " The inner wall is held at Ti = {Ti} degC and the outer wall at To = {To} degC."
    requires: Ti
  - text: " The material has Poisson's ratio nu = {nu}."
  - text: " The Young's modulus is E = {E} GPa."
    requires: E
  - text: " The coefficient of thermal expansion is alpha = {alpha} /degC."
    requires: alpha
  - text: >-
      Report the circumferential (hoop) thermal stress at the inner and outer walls.
      Requirements: use the mm-N-MPa unit system; put the inner-wall nodes in a node set named
      INNER_WALL and the outer-wall nodes in OUTER_WALL.

parameters:
  Ti:    {value: 100,   unit: degC,    droppable: true,  on_drop: ask,       critical: true}
  To:    {value: 0,     unit: degC,    droppable: false}
  E:     {value: 200,   unit: GPa,     droppable: true,  on_drop: assume_ok, critical: false}
  nu:    {value: 0.3,   unit: "-",     droppable: false}
  alpha: {value: 12e-6, unit: "/degC", droppable: true,  on_drop: assume_ok, critical: true}

drop_policy:
  eligible: [Ti, E, alpha]
  n_drop: {min: 0, max: 2}

inputs: {a_mm: 10, b_mm: 20, Ti_degC: 100, To_degC: 0, E_GPa: 200, nu: 0.3, alpha: 12e-6}

modeling_contract:
  required_sets: [INNER_WALL, OUTER_WALL]
  notes: mm-N-MPa; sequential thermal-stress (steady heat transfer -> static), or predefined log temperature field.

expected:
  - name: hoop_stress_inner
    description: Hoop thermal stress at the inner wall (compressive)
    kind: exact
    value: -210
    tol: 0.08
    unit: MPa
    value_status: needs_verification
    extract: {source: odb, field: S, component: S33, location: {set: INNER_WALL, op: mean}}
  - name: hoop_stress_outer
    description: Hoop thermal stress at the outer wall (tensile)
    kind: trend
    sign: "+"
    unit: MPa
    value_status: needs_verification
    extract: {source: odb, field: S, component: S33, location: {set: OUTER_WALL, op: mean}}

reference:
  formula: >-
    Steady log temperature T(r) = Ti ln(b/r)/ln(b/a).
    sigma_theta(a) = E alpha Ti / [2(1-nu) ln(b/a)] * [1 - 2 b^2/(b^2-a^2) ln(b/a)]
  computed: {hoop_stress_inner: -210, hoop_stress_outer: 120}
  source: "Thermoelastic hollow cylinder (Timoshenko, Theory of Thermal Stresses; Boley & Weiner)"

notes: |
  The closed-form coefficient is error-prone; both values are flagged needs_verification and
  must be confirmed (Boley & Weiner) before locking as gold standard. Inner compressive, outer tensile.
