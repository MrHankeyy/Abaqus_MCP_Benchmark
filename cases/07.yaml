schema_version: 1

id: "07"
name: O-ring seal compression
tags:
  analysis: S
  geometry: Ax
  material: HE
difficulty: hard

# --- Templated prompt -------------------------------------------------------
# The Agent receives the concatenation of the segments below. A fragment that
# carries `requires: X` is omitted when parameter X is dropped by the generator.
prompt_segments:
  - text: "A rubber O-ring seal has "
  - text: "a circular cross-section of diameter d = {d} mm and "
    requires: d
  - text: >-
      a ring mean diameter of {D_mean} mm. Using an axisymmetric model, the O-ring is
      compressed between two rigid flat plates by {stroke} mm (20% of the cross-section
      diameter). Model the contact between the O-ring and the rigid plates. Material:
      nearly incompressible rubber, Mooney-Rivlin model with C10 = {C10} MPa
  - text: ", C01 = {C01} MPa"
    requires: C01
  - text: >-
      .
      Report the peak contact pressure and the relationship between the reaction force and
      the compression (the loading curve).
      Requirements: use the mm-N-MPa unit system; enable geometric nonlinearity (NLGEOM);
      request contact pressure (CPRESS) output and the rigid-plate reference-point reaction
      force (RF).

parameters:
  d:      {value: 5,   unit: mm,  droppable: true,  on_drop: ask, critical: true}
  D_mean: {value: 30,  unit: mm,  droppable: false}              # core geometry; always present
  stroke: {value: 1,   unit: mm,  droppable: false}              # core loading; always present
  C10:    {value: 0.3, unit: MPa, droppable: false}              # at least one constant kept
  C01:    {value: 0.1, unit: MPa, droppable: true,  on_drop: ask, critical: true}

drop_policy:
  eligible: [d, C01]            # only these may be dropped (reproduces the two example variants)
  n_drop: {min: 0, max: 2}      # 0 => full-info baseline; up to 2 dropped per run
  never_drop_together: []       # (here both can be dropped together safely)

inputs:
  section_dia_mm: 5
  mean_dia_mm: 30
  compression_mm: 1.0
  compression_ratio: 0.20
  C10_MPa: 0.3
  C01_MPa: 0.1

modeling_contract:
  required_sets: []
  notes: axisymmetric hyperelastic (CAX4H, hybrid); NLGEOM=ON; define ring-plate contact;
         output CPRESS and the rigid-plate reference-point reaction force.

expected:
  - name: peak_contact_pressure
    description: Peak contact pressure at 20% compression (no simple closed form;
                 graded by order of magnitude and sign)
    kind: trend
    range: [0.3, 5.0]          # order-of-magnitude interval, MPa (provisional; to be tightened)
    sign: "+"
    unit: MPa
    value_status: needs_literature_pinning
    extract:
      source: odb
      field: CPRESS
      quantity: contact_pressure
      location: {set: ALL_CONTACT, op: max}

  - name: reaction_vs_compression
    description: Reaction force vs compression; should increase monotonically and be convex
                 (hyperelastic stiffening plus growing contact area)
    kind: trend
    monotonic: "increasing vs compression"
    sign: "+"
    unit: N
    value_status: needs_literature_pinning
    extract:
      source: odb
      field: RF
      quantity: reaction_force
      location: {set: RIGID_REF, op: max_abs}

reference:
  formula: "No simple closed form. Trend basis: under hyperelastic + contact, contact pressure
            increases monotonically with compression; growing contact area makes the
            reaction-force curve convex."
  computed: null
  source: "Typical seal contact/hyperelastic benchmark (Abaqus Example Problems Manual, seals)"

notes: |
  This case primarily probes robustness of hyperelastic + self/contact convergence; it is not
  graded on strict D2 error, only on trend / order of magnitude.
  `range` is a provisional order-of-magnitude interval and must be tightened with a
  high-quality converged solution or literature value (tracked via value_status).
