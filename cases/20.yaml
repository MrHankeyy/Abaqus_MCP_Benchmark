schema_version: 1

id: "20"
name: Fully constrained bar, uniform thermal stress
tags: {analysis: T, geometry: 3D, material: LE}
difficulty: easy

prompt_segments:
  - text: >-
      A steel bar of length 1.0 m with a 20 mm x 20 mm square cross-section is fully fixed at
      both ends (no axial movement at either end).
  - text: " Its temperature is raised uniformly by delta_T = {dT} degC."
    requires: dT
  - text: " The material has Young's modulus E = {E} GPa."
    requires: E
  - text: " The coefficient of thermal expansion is alpha = {alpha} /degC."
    requires: alpha
  - text: >-
      Assume linear elasticity and small strain. Report the axial thermal stress in the bar and
      the support reaction force. Requirements: use the mm-N-MPa unit system; put one end's
      nodes in a node set named END_A.

parameters:
  dT:    {value: 100,   unit: degC,   droppable: true,  on_drop: ask,       critical: true}
  E:     {value: 200,   unit: GPa,    droppable: true,  on_drop: assume_ok, critical: false}
  alpha: {value: 12e-6, unit: "/degC", droppable: true, on_drop: assume_ok, critical: true}

drop_policy:
  eligible: [dT, E, alpha]
  n_drop: {min: 0, max: 2}

inputs: {L_m: 1.0, A_mm2: 400, dT_degC: 100, E_GPa: 200, alpha: 12e-6}

modeling_contract:
  required_sets: [END_A]
  notes: mm-N-MPa; static step with a predefined uniform temperature field (set reference temperature); both ends fixed.

expected:
  - name: axial_thermal_stress
    description: Axial (compressive) thermal stress
    kind: exact
    value: -240
    tol: 0.02
    unit: MPa
    extract: {source: odb, field: S, component: S11, location: {set: END_A, op: mean}}
  - name: reaction_force
    description: Axial support reaction at one end
    kind: exact
    value: -96000
    tol: 0.02
    unit: N
    extract: {source: odb, field: RF, quantity: reaction_force, location: {set: END_A, op: max_abs}}

reference:
  formula: "sigma = -E alpha delta_T; N = sigma * A"
  computed: {axial_thermal_stress: -240, reaction_force: -96000}
  source: "Constrained thermal expansion (basic thermoelasticity)"

notes: Stress is independent of length and area; reaction scales with area.
