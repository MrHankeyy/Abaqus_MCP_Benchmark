schema_version: 1

id: "01"
name: Two-bar planar truss
tags: {analysis: S, geometry: Tr, material: LE}
difficulty: easy

prompt_segments:
  - text: >-
      A planar two-bar truss lies in the x-y plane. Node A is at (-1000, 0) mm, node B at
      (1000, 0) mm, and node C at (0, -1000) mm. Bar AC connects A to C and bar BC connects
      B to C.
  - text: " Both bars have the same cross-sectional area A = {area} mm^2."
    requires: area
  - text: " Nodes A and B are pinned (fully fixed); node C carries a vertical downward point load F = {F} kN."
    requires: F
  - text: " The material is steel with Young's modulus E = {E} GPa."
    requires: E
  - text: >-
      Build a 2-D truss model and report the axial stress in the bars and the vertical
      displacement of node C. Requirements: use the mm-N-MPa unit system; put both bars in an
      element set named BARS and put node C in a node set named LOAD_NODE.

parameters:
  area: {value: 100, unit: mm^2, droppable: true,  on_drop: ask,       critical: true}
  F:    {value: 10,  unit: kN,   droppable: true,  on_drop: ask,       critical: true}
  E:    {value: 200, unit: GPa,  droppable: true,  on_drop: assume_ok, critical: false}

drop_policy:
  eligible: [area, F, E]
  n_drop: {min: 0, max: 2}
  never_drop_together: []

inputs: {Ax_mm2: 100, F_kN: 10, E_GPa: 200, bar_angle_deg: 45}

modeling_contract:
  required_sets: [BARS, LOAD_NODE]
  notes: mm-N-MPa unit system; 2-D truss elements (T2D2); pinned supports at A and B.

expected:
  - name: bar_axial_stress
    description: Axial (tensile) stress in each bar
    kind: exact
    value: 70.71
    tol: 0.02
    unit: MPa
    extract: {source: odb, field: S, component: S11, location: {set: BARS, op: max_abs}}
  - name: vert_disp_C
    description: Vertical displacement of node C (downward, negative)
    kind: exact
    value: -0.707
    tol: 0.02
    unit: mm
    extract: {source: odb, field: U, component: U2, location: {set: LOAD_NODE, op: mean}}

reference:
  formula: "N = F/(2 sin45) tension; sigma = N/A; v_C = (N L)/(E A)/sin45, L = sqrt(2) m"
  computed: {bar_axial_stress: 70.71, vert_disp_C: -0.707}
  source: "Statically determinate truss, joint method (any structural mechanics text)"

notes: Determinate truss; bars in tension. T2D2 elements; do not use beam elements.
