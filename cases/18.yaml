schema_version: 1

id: "18"
name: Cantilever beam under step load, transient response
tags: {analysis: D, geometry: 3D, material: LE}
difficulty: medium

prompt_segments:
  - text: >-
      A steel cantilever beam of length L = 0.5 m with a 20 mm x 20 mm square cross-section is
      clamped at one end. At t = 0 a suddenly applied, constant transverse tip force (step,
      zero initial velocity) is imposed; there is no damping.
  - text: " The tip step force is F = {F} N."
    requires: F
  - text: " The material has Young's modulus E = {E} GPa."
    requires: E
  - text: " The density is rho = {rho} kg/m^3."
    requires: rho
  - text: >-
      Use implicit dynamics. Report the peak tip deflection and its ratio to the static tip
      deflection under the same force (the dynamic amplification factor). Requirements: use the
      m-N-Pa-s unit system; put the tip node in a node set named TIP.

parameters:
  F:   {value: 100,  unit: N,      droppable: true,  on_drop: ask,       critical: false}
  E:   {value: 200,  unit: GPa,    droppable: true,  on_drop: assume_ok, critical: false}
  rho: {value: 7850, unit: kg/m^3, droppable: true,  on_drop: assume_ok, critical: true}

drop_policy:
  eligible: [F, E, rho]
  n_drop: {min: 0, max: 2}

inputs: {L_m: 0.5, section_mm: [20, 20], F_N: 100, E_GPa: 200, rho: 7850, u_static_m: 1.5625e-3}

modeling_contract:
  required_sets: [TIP]
  notes: m-N-Pa-s; implicit dynamics; no damping; time step fine enough to capture the peak.

expected:
  - name: dynamic_amplification_factor
    description: Peak dynamic deflection / static deflection (undamped step response)
    kind: exact
    value: 2.0
    tol: 0.05
    unit: "-"
    extract: {source: odb, field: U, component: U_transverse, quantity: peak_over_history, location: {set: TIP, op: max_abs}}
  - name: peak_tip_deflection
    description: Peak transverse tip deflection
    kind: exact
    value: 3.125e-3
    tol: 0.05
    unit: m
    extract: {source: odb, field: U, component: U_transverse, quantity: peak_over_history, location: {set: TIP, op: max_abs}}

reference:
  formula: "u_static = F L^3/(3 E I); undamped step response DAF = u_peak/u_static = 2"
  computed: {dynamic_amplification_factor: 2.0, peak_tip_deflection: 3.125e-3}
  source: "Structural dynamics, SDOF step response"

notes: DAF is independent of F; adding damping reduces the peak below 2x.
