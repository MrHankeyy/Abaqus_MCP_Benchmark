schema_version: 1

id: "02"
name: NAFEMS LE1 elliptic membrane
tags: {analysis: S, geometry: Pl, material: LE}
difficulty: medium

prompt_segments:
  - text: >-
      Solve the NAFEMS LE1 elliptic-membrane benchmark (plane stress). Model one quarter of
      an elliptic plate. The outer ellipse is x^2/3.25^2 + y^2/2.75^2 = 1 and the inner
      ellipse is x^2/2.0^2 + y^2/1.25^2 = 1 (units: m); take the first quadrant.
  - text: " The plate thickness is t = {t} m."
    requires: t
  - text: " An outward pressure p = {p} MPa acts on the inner edge BC."
    requires: p
  - text: >-
      The straight edge AB (along the y-axis) has zero x-displacement and the straight edge CD
      (along the x-axis) has zero y-displacement (symmetry).
  - text: " The material is steel: Young's modulus E = {E} GPa, Poisson's ratio nu = {nu}."
    requires: E
  - text: >-
      Report the y-direction normal stress sigma_yy at point D, the inner point on the x-axis
      (the lower inside corner). Requirements: use the m-N-Pa unit system; create a node set
      named POINT_D at that point.

parameters:
  t:  {value: 0.1, unit: m,   droppable: true,  on_drop: assume_ok, critical: false}
  p:  {value: 10,  unit: MPa, droppable: true,  on_drop: ask,       critical: true}
  E:  {value: 210, unit: GPa, droppable: true,  on_drop: assume_ok, critical: false}
  nu: {value: 0.3, unit: "-", droppable: false}

drop_policy:
  eligible: [t, p, E]
  n_drop: {min: 0, max: 2}

inputs: {E_GPa: 210, nu: 0.3, p_MPa: 10, t_m: 0.1}

modeling_contract:
  required_sets: [POINT_D]
  notes: m-N-Pa unit system; plane-stress elements (CPS8/CPS8R recommended); symmetry BCs on AB and CD.

expected:
  - name: sigma_yy_D
    description: Tangential (y) normal stress at point D
    kind: exact
    value: 92.7
    tol: 0.03
    unit: MPa
    extract: {source: odb, field: S, component: S22, location: {set: POINT_D, op: mean}}

reference:
  formula: "NAFEMS standard target solution (no elementary closed form)"
  computed: {sigma_yy_D: 92.7}
  source: "NAFEMS LE1 / Abaqus Benchmarks Manual 4.2.1 (target 92.7 MPa)"

notes: Stress at D is independent of thickness for this traction-loaded plane-stress problem.
